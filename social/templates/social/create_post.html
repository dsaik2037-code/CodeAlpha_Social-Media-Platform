<!DOCTYPE html>
<html>

<head>

    <title>Create Post - ConnectHub</title>

    <style>

        body {
            font-family: Arial;
            background: #f2f4f7;
        }

        .container {
            width: 500px;
            max-width: 90%;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            box-sizing: border-box;
        }

        input {
            margin-top: 15px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #1877f2;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }

        a {
            display: block;
            margin-top: 20px;
            text-align: center;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>📝 Create a Post</h1>

    <form method="POST" enctype="multipart/form-data" class="post-form">

        {% csrf_token %}

        <textarea
            name="content"
            placeholder="What's on your mind?"
            required
        ></textarea>

        <br>

        <input
            type="file"
            name="image"
            accept="image/*"
        >

        <button type="submit">
            🚀 Publish Post
        </button>

    </form>

    <a href="{% url 'home' %}">
        🏠 Back to Home
    </a>

</div>

</body>

</html>
