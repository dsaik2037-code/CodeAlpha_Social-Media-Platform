<!DOCTYPE html>
<html>

<head>

    <title>Create Post - ConnectHub</title>

    

</head>

<body>

<div class="container">

    <h1>📝 Create a Post</h1>

    <form method="POST" enctype="multipart/form-data" class="post-form">

        {% csrf_token %}

        <textarea
            name="content"
            placeholder="What's on your mind?"
            required
        ></textarea>

        <br>

        <input
            type="file"
            name="image"
            accept="image/*"
        >

        <button type="submit">
            🚀 Publish Post
        </button>

    </form>

    <a href="{% url 'home' %}">
        🏠 Back to Home
    </a>

</div>

</body>

</html>
